[project]
name = "braindecode-lightning"
version = "0.1.0"
description = "EEGNet training pipeline with braindecode + PyTorch Lightning"
requires-python = ">=3.12"
dependencies = [
    "braindecode[moabb]",
    "lightning",
    "torch",
    "torchmetrics",
    "mne",
    "rich>=15.0.0",
    "torchview>=0.2.7",
    "torchinfo>=1.8.0",
    "torchvision>=0.28.0",
    "tensorboard>=2.21.0",
]


